# Local development database.
#
# Spins up a pgvector-enabled Postgres (required by the memories embedding
# column / HNSW index) and runs the project's own migrate + seed scripts once
# the DB is healthy, so the schema and seed data never drift from the source.
#
# Usage:
#   docker compose up -d            # start DB and seed it on first boot
#   docker compose logs -f seed     # watch migrate/seed progress
#   docker compose down             # stop (data is kept in the named volume)
#   docker compose down -v          # stop and wipe the database volume
#
# Point the app/tooling at it with:
#   DATABASE_URL=postgresql://markov:markov@localhost:5432/markov

services:
  db:
    # pgvector image == stock Postgres + the `vector` extension preinstalled.
    image: pgvector/pgvector:pg17
    container_name: markov-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-markov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markov}
      POSTGRES_DB: ${POSTGRES_DB:-markov}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - markov-db-data:/var/lib/postgresql/data
      # First-boot init: ensure the pgvector extension exists before the schema
      # (memories.embedding) is pushed.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-markov} -d ${POSTGRES_DB:-markov}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: applies drizzle migrations (journal-tracked, idempotent) then
  # seeds catchables/items/shop. The seed script skips itself if the DB is
  # already seeded, so this is safe across repeated `up` runs.
  seed:
    image: node:20-bookworm
    container_name: markov-db-seed
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides whatever is in the mounted .env (dotenv does not clobber an
      # already-set env var), so migrate/seed target the local container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-markov}:${POSTGRES_PASSWORD:-markov}@db:5432/${POSTGRES_DB:-markov}
    volumes:
      - .:/app
    command: >
      sh -c "[ -d node_modules ] || npm ci;
             npm run db:migrate &&
             npm run db:seed"
    restart: "no"

volumes:
  markov-db-data:
