name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # config.json is gitignored, but modules require it at import time.
      - name: Seed config from example
        run: cp config/config.example.json config/config.json

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Run live AI evals
        if: >-
          github.event_name == 'push' ||
          (github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run eval:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
